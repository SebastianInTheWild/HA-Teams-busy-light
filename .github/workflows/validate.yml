name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images ship locally in custom_components/teams_status/brand
          ignore: brands

  shellcheck:
    name: ShellCheck (macOS scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze
        run: shellcheck -x macos/*.sh

  powershell:
    name: PSScriptAnalyzer (Windows scripts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./windows -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  windows-download:
    name: Build Windows download
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        # Unsigned: the signing secrets are only available to the release
        # (environment "release" with approval); the release build checks
        # the certificate against Common.ps1 before anything is uploaded
        shell: powershell
        run: ./windows/tools/build-release.ps1 -Version 0.0.0 -OutputPath dist

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        # Signed ad hoc: the signing secrets are only available to the release
        # (environment "release" with approval)
        run: bash macos/build.sh
      - name: Check
        run: |
          app="macos/build/Teams Busy Light.app"
          lipo -archs "$app/Contents/MacOS/TeamsBusyLight"
          "$app/Contents/MacOS/TeamsBusyLight" --show
