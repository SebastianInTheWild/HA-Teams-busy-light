name: Validate

# Pushes run it through the release workflow (which publishes only after it
# passed), so it is not started for pushes here
on:
  workflow_call:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Only reading; no job needs more
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to a commit: a moved branch must not change what runs here
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master, 2026-11-19

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration
          # Brand images ship locally in custom_components/teams_status/brand
          ignore: brands

  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          # The current Home Assistant needs Python 3.14
          python-version: "3.14"
      - name: Install
        run: pip install pytest-homeassistant-custom-component
      - name: Test
        run: pytest -q

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: a secret removed later is still in it
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          gh release download "v$VERSION" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${VERSION}_linux_x64.tar.gz" --pattern "gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan the history and the files
        # Findings are shown redacted; allowed exceptions go in .gitleaks.toml
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact --verbose --no-banner

  shellcheck:
    name: ShellCheck (macOS scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze
        run: shellcheck -x macos/*.sh

  powershell:
    name: PSScriptAnalyzer (Windows scripts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./windows -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  windows-app:
    name: Windows app (tests and download)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        # .NET Framework 4.8 app; the .NET SDK of the runner builds it
        run: dotnet test windows/tests --configuration Release --nologo
      - name: Build the download
        # Unsigned: the signing secrets are only available to the release
        # (environment "release" with approval); the release build checks
        # the certificate against Paths.cs before anything is uploaded
        shell: powershell
        run: ./windows/tools/build-release.ps1 -Version 0.0.0 -OutputPath dist

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        # Signed ad hoc: the signing secrets are only available to the release
        # (environment "release" with approval)
        run: bash macos/build.sh
      - name: Check
        run: |
          app="macos/build/Teams Busy Light.app"
          lipo -archs "$app/Contents/MacOS/TeamsBusyLight"
          "$app/Contents/MacOS/TeamsBusyLight" --show
