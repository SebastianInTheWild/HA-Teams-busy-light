name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images ship locally in custom_components/teams_status/brand
          ignore: brands

  shellcheck:
    name: ShellCheck (macOS scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze
        run: shellcheck -x macos/*.sh

  powershell:
    name: PSScriptAnalyzer (Windows scripts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./windows -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        # Same signing as the release, so a broken certificate shows up before tagging
        # (secrets are empty for pull requests from forks: then ad hoc)
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: bash macos/build.sh
      - name: Check
        env:
          SIGNED: ${{ secrets.MACOS_SIGNING_P12 != '' }}
        run: |
          app="macos/build/Teams Busy Light.app"
          if [ "$SIGNED" = "true" ]; then
            codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf'
          fi
          lipo -archs "$app/Contents/MacOS/TeamsBusyLight"
          "$app/Contents/MacOS/TeamsBusyLight" --show
