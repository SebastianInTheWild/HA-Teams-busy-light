blueprint:
  name: Teams Busy Light
  description: >-
    Shows the Microsoft Teams status (integration "Teams Busy Light") on
    lights: Available = green, Busy/In a meeting/In a call = red,
    Do not disturb/Presenting/Focusing = red (custom color possible),
    Away/Be right back = orange, Offline = off.
    Select the Teams device (one per computer, named "Teams ..." after the
    name entered when setting up the integration); its status and call
    activity are used automatically. Optionally, music or radio can be played
    on a media player whenever Teams is not in a call or offline.
    Requires Teams Busy Light integration 1.6.0 or newer.
  domain: automation
  source_url: https://github.com/SebastianInTheWild/HA-Teams-busy-light/blob/main/blueprints/automation/teams_status/teams_busy_light.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    lights:
      name: Teams and lights
      icon: mdi:lightbulb-group
      input:
        teams_device:
          name: Teams device
          description: The Teams device whose status the lights show.
          selector:
            device:
              integration: teams_status
        target_lights:
          name: Lights
          description: Lights that show the Teams status.
          selector:
            target:
              entity:
                domain: light
    appearance:
      name: Colors and brightness
      icon: mdi:palette
      collapsed: true
      input:
        brightness:
          name: Brightness
          default: 100
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        color_available:
          name: Available
          default: [0, 255, 0]
          selector:
            color_rgb: {}
        color_busy:
          name: Busy, In a meeting, In a call
          default: [255, 30, 10]
          selector:
            color_rgb: {}
        color_do_not_disturb:
          name: Do not disturb, Presenting, Focusing
          default: [255, 30, 10]
          selector:
            color_rgb: {}
        color_away:
          name: Away, Be right back
          default: [252, 150, 0]
          selector:
            color_rgb: {}
    audio:
      name: Optional music or radio
      icon: mdi:speaker
      collapsed: true
      input:
        enable_audio:
          name: Enable music or radio
          description: Configure the speaker and media below when enabled.
          default: false
          selector:
            boolean: {}
        speaker:
          name: Smart speaker
          description: Required when music or radio playback is enabled.
          default: ""
          selector:
            entity:
              domain: media_player
        media_content_id:
          name: Media content ID
          description: Required to start playback; use a media source ID or URL supported by the selected speaker.
          default: ""
          selector:
            text: {}
        media_content_type:
          name: Media type
          default: music
          selector:
            select:
              options:
                - music
                - radio

# The newest Teams state always wins
mode: restart
max_exceeded: silent

# The integration fires this event whenever the status or call activity changes
triggers:
  - trigger: event
    event_type: teams_status_changed
    event_data:
      device_id: !input teams_device

variables:
  teams_device: !input teams_device
  # Without the event ("Run actions"), the current states of the device's
  # sensors are used
  sensor_states: >-
    {{ device_entities(teams_device) | select('match', 'sensor\.')
       | map('states') | list }}
  status: >-
    {% if trigger.platform == 'event' %}{{ trigger.event.data.status }}
    {%- else %}{{ sensor_states | select('in', ['available', 'busy',
       'in_a_call', 'in_a_meeting', 'presenting', 'focusing',
       'do_not_disturb', 'be_right_back', 'away', 'offline'])
       | first | default(none) }}{% endif %}
  activity: >-
    {% if trigger.platform == 'event' %}{{ trigger.event.data.activity }}
    {%- else %}{{ sensor_states | select('in', ['not_in_call', 'in_call',
       'incoming_call', 'outgoing_call']) | first | default(none) }}{% endif %}
  in_call: >-
    {{ status == 'in_a_call' or
       activity in ['in_call', 'incoming_call', 'outgoing_call'] }}
  audio_enabled: !input enable_audio
  speaker_entity: !input speaker
  media_content_id: !input media_content_id

actions:
  - choose:
      - alias: Offline
        conditions: "{{ status == 'offline' }}"
        sequence:
          - action: light.turn_off
            target: !input target_lights
      - alias: Do not disturb, Presenting, Focusing
        conditions: "{{ status in ['do_not_disturb', 'presenting', 'focusing'] }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_do_not_disturb
              brightness_pct: !input brightness
      - alias: Busy or in a call
        conditions: "{{ in_call or status in ['busy', 'in_a_meeting'] }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_busy
              brightness_pct: !input brightness
      - alias: Away
        conditions: "{{ status in ['away', 'be_right_back'] }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_away
              brightness_pct: !input brightness
      - alias: Available
        conditions: "{{ status == 'available' }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_available
              brightness_pct: !input brightness
  - choose:
      - alias: Stop music during calls or offline
        conditions:
          - "{{ audio_enabled and (speaker_entity | length > 0) }}"
          - "{{ in_call or status == 'offline' }}"
        sequence:
          - action: media_player.media_stop
            target:
              # From the variable: an empty input would fail validation
              entity_id: "{{ speaker_entity }}"
      - alias: Play music outside calls and offline
        conditions:
          - >-
            {{ audio_enabled and (speaker_entity | length > 0) and
               (media_content_id | length > 0) }}
          - "{{ not in_call and status != 'offline' }}"
          - "{{ states(speaker_entity) != 'playing' }}"
        sequence:
          - action: media_player.play_media
            target:
              # From the variable: an empty input would fail validation
              entity_id: "{{ speaker_entity }}"
            data:
              media_content_id: !input media_content_id
              media_content_type: !input media_content_type
