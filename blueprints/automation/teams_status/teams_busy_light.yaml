blueprint:
  name: Teams Busy Light
  description: >-
    Shows the Microsoft Teams status (integration "Teams Busy Light") on
    lights: Available = green, Busy/In a meeting/In a call = red,
    Do not disturb/Presenting/Focusing = red (custom color possible),
    Away/Be right back = orange, Offline = off.
    When setting up the integration, "Teams" is added in front of the
    entered name automatically. Optionally, music or radio can be played on
    a media player whenever Teams is not in a call or offline.
  domain: automation
  source_url: https://github.com/SebastianInTheWild/HA-Teams-busy-light/blob/main/blueprints/automation/teams_status/teams_busy_light.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    lights:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        target_lights:
          name: Lights
          description: Lights that show the Teams status.
          selector:
            target:
              entity:
                domain: light
    teams:
      name: Teams sensors
      icon: mdi:microsoft-teams
      collapsed: true
      input:
        status_sensor:
          name: Status sensor
          selector:
            entity:
              integration: teams_status
              domain: sensor
        activity_sensor:
          name: Activity sensor
          selector:
            entity:
              integration: teams_status
              domain: sensor
    appearance:
      name: Colors and brightness
      icon: mdi:palette
      collapsed: true
      input:
        brightness:
          name: Brightness
          default: 100
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        color_available:
          name: Available
          default: [0, 255, 0]
          selector:
            color_rgb: {}
        color_busy:
          name: Busy, In a meeting, In a call
          default: [255, 30, 10]
          selector:
            color_rgb: {}
        color_do_not_disturb:
          name: Do not disturb, Presenting, Focusing
          default: [255, 30, 10]
          selector:
            color_rgb: {}
        color_away:
          name: Away, Be right back
          default: [252, 150, 0]
          selector:
            color_rgb: {}
    audio:
      name: Optional music or radio
      icon: mdi:speaker
      collapsed: true
      input:
        enable_audio:
          name: Enable music or radio
          description: Configure the speaker and media below when enabled.
          default: false
          selector:
            boolean: {}
        speaker:
          name: Smart speaker
          description: Required when music or radio playback is enabled.
          default: ""
          selector:
            entity:
              domain: media_player
        media_content_id:
          name: Media content ID
          description: Required to start playback; use a media source ID or URL supported by the selected speaker.
          default: ""
          selector:
            text: {}
        media_content_type:
          name: Media type
          default: music
          selector:
            select:
              options:
                - music
                - radio

# The newest Teams state always wins
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input status_sensor
    to:
      - available
      - busy
      - in_a_call
      - in_a_meeting
      - presenting
      - focusing
      - do_not_disturb
      - be_right_back
      - away
      - offline
  - trigger: state
    entity_id: !input activity_sensor
    to:
      - not_in_call
      - in_call
      - incoming_call
      - outgoing_call

actions:
  - choose:
      - alias: Offline
        conditions:
          - condition: state
            entity_id: !input status_sensor
            state: offline
        sequence:
          - action: light.turn_off
            target: !input target_lights
      - alias: Do not disturb, Presenting, Focusing
        conditions:
          - condition: state
            entity_id: !input status_sensor
            state: [do_not_disturb, presenting, focusing]
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_do_not_disturb
              brightness_pct: !input brightness
      - alias: Busy or in a call
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: !input status_sensor
                state: [busy, in_a_call, in_a_meeting]
              - condition: state
                entity_id: !input activity_sensor
                state: [in_call, incoming_call, outgoing_call]
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_busy
              brightness_pct: !input brightness
      - alias: Away
        conditions:
          - condition: state
            entity_id: !input status_sensor
            state: [away, be_right_back]
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_away
              brightness_pct: !input brightness
      - alias: Available
        conditions:
          - condition: state
            entity_id: !input status_sensor
            state: available
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              rgb_color: !input color_available
              brightness_pct: !input brightness
  - variables:
      audio_enabled: !input enable_audio
      speaker_entity: !input speaker
      media_content_id: !input media_content_id
      status_entity: !input status_sensor
      activity_entity: !input activity_sensor
  - choose:
      - alias: Stop music during calls or offline
        conditions:
          - condition: template
            value_template: >-
              {{ audio_enabled and (speaker_entity | length > 0) }}
          - condition: or
            conditions:
              - condition: state
                entity_id: !input status_sensor
                state: [in_a_call, offline]
              - condition: state
                entity_id: !input activity_sensor
                state: [in_call, incoming_call, outgoing_call]
        sequence:
          - action: media_player.media_stop
            target:
              entity_id: !input speaker
      - alias: Play music outside calls and offline
        conditions:
          - condition: template
            value_template: >-
              {{ audio_enabled and (speaker_entity | length > 0) and
                 (media_content_id | length > 0) }}
          - condition: template
            value_template: "{{ states(speaker_entity) != 'playing' }}"
          - condition: template
            value_template: >-
              {{ not is_state(status_entity, 'in_a_call') and
                 not is_state(status_entity, 'offline') and
                 states(activity_entity) not in
                 ['in_call', 'incoming_call', 'outgoing_call'] }}
        sequence:
          - action: media_player.play_media
            target:
              entity_id: !input speaker
            data:
              media_content_id: !input media_content_id
              media_content_type: !input media_content_type
